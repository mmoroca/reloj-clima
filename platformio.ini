; Reloj con tiempo atmosférico para el T-Keyboard (ESP32-C3).

[env:T-Keyboard-clima]
platform = espressif32 @ 6.1
board = ttgo-t-oi-plus
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
; Mismas particiones que Scrabble: app de 3.94 MB, sin OTA.
board_build.partitions = partitions_clima.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
build_type = release
